# Agent Doc AI — statische Seite hinter dem vorhandenen Traefik auf VPS 1709062.
# Ausrollen über die Hostinger-API (vps_docker_create), kein SSH nötig.
# Muster übernommen vom bestehenden Projekt "werkbank" auf derselben Maschine.
#
# Benötigte Umgebungsvariablen:
#   GITHUB_REPO   z. B. MaddowV/agent-doc-ai
#   GITHUB_TOKEN  Lesezugriff auf das Repo (bei öffentlichem Repo nicht nötig)

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      GITHUB_REPO: "${GITHUB_REPO}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
    entrypoint:
      - sh
      - -lc
      - |
        set -e
        apk add --no-cache git >/dev/null
        rm -rf /srv/site
        if [ -n "$$GITHUB_TOKEN" ]; then
          git clone --depth 1 "https://x-access-token:$$GITHUB_TOKEN@github.com/$$GITHUB_REPO.git" /srv/site
        else
          git clone --depth 1 "https://github.com/$$GITHUB_REPO.git" /srv/site
        fi
        exec nginx -c /srv/site/deploy/nginx.conf -g 'daemon off;'
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agentdoc.rule=Host(`agentdocai.com`) || Host(`www.agentdocai.com`)"
      - "traefik.http.routers.agentdoc.entrypoints=websecure"
      - "traefik.http.routers.agentdoc.tls.certresolver=letsencrypt"
      - "traefik.http.services.agentdoc.loadbalancer.server.port=8080"
      # www auf die nackte Domain umleiten
      - "traefik.http.middlewares.agentdoc-www.redirectregex.regex=^https://www\\.agentdocai\\.com/(.*)"
      - "traefik.http.middlewares.agentdoc-www.redirectregex.replacement=https://agentdocai.com/$${1}"
      - "traefik.http.middlewares.agentdoc-www.redirectregex.permanent=true"
      - "traefik.http.routers.agentdoc.middlewares=agentdoc-www"
