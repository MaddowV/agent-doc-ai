# Agent Doc AI — statische Website hinter dem vorhandenen Traefik auf VPS 1709062.
# Ausrollen über die Hostinger-API (vps_docker_create), kein SSH nötig.
#
# Umgebungsvariablen:
#   SITE_RULE  Traefik-Regel, z. B. Host(`probe.agentdocai.com`)
#              oder Host(`agentdocai.com`) || Host(`www.agentdocai.com`)
#
# Der Server liefert nur statische Dateien aus. Das Formular geht an eine
# Supabase Edge Function — bewusst dort, weil Supabase-Secrets nicht
# zurückgelesen werden können, die Hostinger-API Umgebungsvariablen aber
# im Klartext herausgibt.

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    entrypoint:
      - sh
      - -lc
      - |
        set -e
        apk add --no-cache git >/dev/null
        rm -rf /srv/site
        git clone --depth 1 https://github.com/MaddowV/agent-doc-ai.git /srv/site
        exec nginx -c /srv/site/deploy/nginx.conf -g 'daemon off;'
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agentdoc.rule=${SITE_RULE}"
      - "traefik.http.routers.agentdoc.entrypoints=websecure"
      - "traefik.http.routers.agentdoc.tls.certresolver=letsencrypt"
      - "traefik.http.services.agentdoc.loadbalancer.server.port=8080"

