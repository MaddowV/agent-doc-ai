worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Zugriffsprotokoll bewusst datenarm: keine IP-Adresse, kein User-Agent,
  # kein Referrer. Damit entstehen auf dem Server keine personenbezogenen
  # Protokolldaten — das ist genau das, was die Datenschutzerklärung zusagt.
  log_format datenarm '$time_iso8601 "$request" $status $body_bytes_sent';
  access_log /dev/stdout datenarm;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 30;
  server_tokens   off;
  charset         utf-8;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   512;
  gzip_types        text/plain text/css application/javascript image/svg+xml application/json;

  server {
    listen      8080;
    server_name _;
    root        /srv/site;
    index       index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://fyuyuqlsjmpyoszhligp.supabase.co; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # HTML immer neu holen: dort stehen die Fingerabdrücke der übrigen Dateien.
    # Nur `expires` setzen, kein add_header — sonst würden die Sicherheits-Header
    # aus dem server-Block in diesen Blöcken verloren gehen.
    expires epoch;

    # CSS und JS tragen den Fingerabdruck ihres Inhalts in der Adresse
    # (siehe deploy/stempel.py). Ändert sich der Inhalt, ändert sich die
    # Adresse — der alte Cache-Eintrag wird damit nie wieder angefragt und
    # kann getrost lange liegen bleiben. Schriften ändern sich ohnehin nie.
    location ~* \.woff2$     { expires 1y; }
    location ~* \.(css|js)$  { expires 1y; }

    # Saubere Adressen: /impressum liefert impressum.html
    location / { try_files $uri $uri.html $uri/ =404; }

    # Der Server liefert das geklonte Repo aus. Alles, was zur Entwicklung
    # gehört und nicht zur Website, bleibt deshalb ausdrücklich zu —
    # sonst stünden Mail-Vorlagen und Quelltexte unter agentdocai.com.
    location ^~ /deploy/      { return 404; }
    location ^~ /emails/      { return 404; }
    location ^~ /supabase/    { return 404; }
    location ^~ /unterlagen/  { return 404; }
    location ^~ /.git         { return 404; }
    location = /README.md     { return 404; }
  }
}
